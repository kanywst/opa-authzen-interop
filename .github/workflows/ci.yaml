name: CI

# Until this existed, nothing here ran the tests: a broken rule surfaced in
# opa-authzen-plugin's CI, against main rather than the pull request.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so an OPA release that breaks the policy fails in a commit that
  # names the version.
  OPA_VERSION: v1.19.1

jobs:
  rego:
    name: Rego check, fmt, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install OPA
        run: |
          curl -fsSL -o /usr/local/bin/opa \
            "https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x /usr/local/bin/opa
          opa version

      - name: Check policy compiles against the data
        run: opa check policy/ data/

      - name: Check formatting
        run: opa fmt --fail --diff policy/

      - name: Unit tests
        run: opa test policy/ data/ -v

  e2e:
    name: Integration tests against the PDP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Pulls the public image pinned in the Makefile, so no registry login.
      - name: Integration tests
        run: make integration-test

      - name: PDP logs on failure
        if: failure()
        run: docker compose logs --no-color
