plugins:
  authzen:
    path: "authzen"
    decision: "allow"
    # Returned as the Decision's optional `context` member (spec Section 5.5.1).
    decision_context: "decision_context"
    # AuthZEN Search APIs (spec Section 8). Each field names a Rego rule in
    # the `authzen` package that returns the set of permitted entities for
    # a partial input. Omit a field to disable the corresponding endpoint.
    search:
      subject: "subject_search"
      resource: "resource_search"
      action: "action_search"
    # Operator-supplied PDP capability URNs (spec Section 9.1.2); the AuthZEN
    # core registers none of its own.
    capabilities:
      - "urn:kanywst:authzen:capability:todo-interop"
    # Obligations Profile 1.0. Also bounds the PEP's declared
    # `context.supported_obligations`, so list only what the policy issues.
    supported_obligations:
      - "notification"
